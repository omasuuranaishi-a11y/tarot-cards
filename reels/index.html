<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の1枚 リールメーカー</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#dfe5d9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe5d9;
  --paper:#f7f4ec;
  --line:#c5cfbf;
  --sage:#9fb19a;
  --sage-deep:#4f6b5a;
  --ink:#3b4a3f;
  --ink-dim:#6c786d;
  --gold:#b98f45;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Klee One','Noto Serif JP',serif;background:var(--bg);color:var(--ink);min-height:100dvh;letter-spacing:.03em}
.top{text-align:center;padding:26px 16px 6px}
.brand{font-family:'Cormorant Garamond',serif;font-size:.78rem;letter-spacing:.45em;color:var(--gold)}
h1{font-weight:600;font-size:1.35rem;letter-spacing:.18em;margin-top:4px}
.lead{font-size:.8rem;color:var(--ink-dim);line-height:1.9;margin-top:8px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 56px;display:grid;gap:22px}
@media (min-width:820px){
  .wrap{grid-template-columns:minmax(0,400px) minmax(0,1fr);align-items:start}
  .stage{position:sticky;top:14px}
}
#cv{display:block;width:100%;max-width:calc(70vh * 9 / 16);height:auto;margin:0 auto;border-radius:18px;background:#b9c6b2;box-shadow:0 14px 34px rgba(59,74,63,.22)}
.player{display:flex;align-items:center;gap:10px;max-width:calc(70vh * 9 / 16);margin:12px auto 0}
.player input{flex:1;accent-color:var(--sage-deep)}
#time{font-family:'Cormorant Garamond',serif;font-size:.95rem;min-width:3.6em;text-align:right;color:var(--ink-dim)}
.controls{display:grid;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 16px}
.field{display:grid;gap:7px}
.field>label,.lbl{font-size:.82rem;font-weight:600;color:var(--sage-deep)}
input[type=text],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{line-height:1.7;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.file:focus-within{outline:2px solid var(--sage-deep);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row select{flex:1;min-width:0}
.seg{display:flex;gap:8px}
.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:999px;padding:9px 0;font-size:.88rem;cursor:pointer;background:#fff}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--sage-deep);border-color:var(--sage-deep);color:#f6f1e4}
.seg label:has(input:focus-visible){outline:2px solid var(--sage-deep);outline-offset:2px}
button,.file{font:inherit;cursor:pointer;letter-spacing:.08em}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--sage-deep);color:var(--sage-deep);background:transparent;border-radius:999px;padding:9px 16px;font-size:.85rem;text-decoration:none;white-space:nowrap}
.btn-main{border:none;background:var(--sage-deep);color:#f6f1e4;border-radius:999px;padding:14px 18px;font-size:1rem;font-weight:600;width:100%}
.btn-main:disabled{opacity:.5;cursor:default}
.link{border:none;background:none;color:var(--ink-dim);font-size:.78rem;text-decoration:underline;justify-self:start;padding:2px 0}
.hint{font-size:.74rem;color:var(--ink-dim);line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chara{display:flex;gap:12px;align-items:center}
.chara img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--sage);border:2px solid #fff;flex:none}
.chara img:not([src]){background:transparent;border:2px dashed var(--line)}
.chara .row{gap:4px 12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sage-deep);transition:width .2s}
#status{font-size:.8rem;color:var(--ink-dim);margin-top:8px}
#result{display:grid;gap:12px}
#result video{width:100%;max-width:240px;margin:0 auto;border-radius:12px;background:#000}
#result .row>*{flex:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <p class="brand">OMASU REEL MAKER</p>
  <h1>今日の1枚 リールメーカー</h1>
  <p class="lead">カードと文面を選んで、縦型のリール動画を作ります。<br>音楽はInstagramの編集画面で付けてください。</p>
</header>

<main class="wrap">
  <section class="stage" aria-label="プレビュー">
    <canvas id="cv" width="1080" height="1920" role="img" aria-label="リールのプレビュー"></canvas>
    <div class="player">
      <button id="play" class="btn-ghost" type="button">▶ 再生</button>
      <input id="seek" type="range" min="0" max="20" step="0.01" value="0" aria-label="再生位置">
      <span id="time">0.0s</span>
    </div>
  </section>

  <section class="controls" aria-label="設定">
    <div class="field">
      <label for="card">カード</label>
      <div class="row"><select id="card"></select><button id="shuffle" class="btn-ghost" type="button">ランダムに引く</button></div>
    </div>
    <div class="field">
      <span class="lbl" id="ori-lbl">向き</span>
      <div class="seg" role="radiogroup" aria-labelledby="ori-lbl">
        <label><input type="radio" name="ori" value="up" checked>正位置</label>
        <label><input type="radio" name="ori" value="rev">逆位置</label>
      </div>
    </div>
    <div class="field">
      <span class="lbl">イラスト</span>
      <div class="chara">
        <img id="chara-thumb" alt="">
        <div class="row">
          <label class="btn-ghost file">画像を選ぶ<input id="chara-file" class="sr" type="file" accept="image/*"></label>
          <button id="chara-clear" class="link" type="button" hidden>外す</button>
        </div>
      </div>
      <p class="hint">正方形のイラストがおすすめです。選んだ画像はこの端末に保存され、次からも使われます。</p>
    </div>
    <div class="field"><label for="f-title">見出し</label><input id="f-title" type="text"></div>
    <div class="field"><label for="f-date">日付</label><input id="f-date" type="text"></div>
    <div class="field"><label for="f-intro">最初のひとこと</label><input id="f-intro" type="text"></div>
    <div class="field">
      <label for="f-msg">メッセージ</label>
      <textarea id="f-msg" rows="5"></textarea>
      <button id="msg-reset" class="link" type="button">カードの文面に戻す</button>
    </div>
    <div class="field"><label for="f-outro">締めのひとこと</label><input id="f-outro" type="text"></div>
    <div class="field"><label for="f-handle">アカウント名</label><input id="f-handle" type="text"></div>
    <div class="field">
      <span class="lbl" id="theme-lbl">雰囲気</span>
      <div class="seg" role="radiogroup" aria-labelledby="theme-lbl">
        <label><input type="radio" name="theme" value="sage" checked>セージ</label>
        <label><input type="radio" name="theme" value="night">夜空</label>
      </div>
    </div>

    <button id="export" class="btn-main" type="button">動画を書き出す</button>
    <div id="progress" hidden>
      <div class="bar"><i id="bar"></i></div>
      <p id="status" role="status"></p>
    </div>
    <div id="result" hidden>
      <video id="out" controls playsinline muted loop></video>
      <div class="row">
        <button id="share" class="btn-main" type="button" hidden>保存・共有する</button>
        <a id="download" class="btn-ghost">ダウンロード</a>
      </div>
      <p id="result-note" class="hint"></p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
<script>
/* ================= ▼ここだけ書き換える▼ ================= */
const DEFAULTS = {

const clamp=v=>v<0?0:v>1?1:v;
const prog=(t,a,b)=>clamp((t-a)/(b-a));

const easeOut=p=>1-Math.pow(1-p,3);
const easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function th(){return THEMES[S.theme];}
function jp(size,w){const T=th();return `${w||T.jpW} ${size}px "${T.jp}","Noto Serif JP",serif`;}
function en(size,it){return `${it?"italic ":""}500 ${size}px "Cormorant Garamond",serif`;}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function star4(c,x,y,s){c.beginPath();c.moveTo(x,y-s);c.quadraticCurveTo(x,y,x+s,y);c.quadraticCurveTo(x,y,x,y+s);c.quadraticCurveTo(x,y,x-s,y);c.quadraticCurveTo(x,y,x,y-s);c.closePath();}
function star5(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}c.closePath();}

/* 文字間をあけて中央揃えで描く */
function spaced(s,x,y,sp){
  const cs=[...s],ws=cs.map(ch=>ctx.measureText(ch).width);
  let cx=x-(ws.reduce((a,b)=>a+b,0)+sp*(cs.length-1))/2;
  ctx.textAlign="left";cs.forEach((ch,i)=>{ctx.fillText(ch,cx,y);cx+=ws[i]+sp;});ctx.textAlign="center";
}
/* [文字, font, 色] の並びを続けて描く。align は "center" か "left" */
function runs(parts,x,y,align){
  const ws=parts.map(([s,f])=>{ctx.font=f;return ctx.measureText(s).width;});
  let cx=align==="left"?x:x-ws.reduce((a,b)=>a+b,0)/2;ctx.textAlign="left";
  parts.forEach(([s,f,col],i)=>{ctx.font=f;ctx.fillStyle=col;ctx.fillText(s,cx,y);cx+=ws[i];});
  ctx.textAlign="center";return cx;
}
function fitSize(s,font,max,min,maxW){let z=max;for(;z>min;z-=2){ctx.font=font(z);if(ctx.measureText(s).width<=maxW)break;}return z;}
/* 禁則つきの折り返し（ctx.font は呼び出し側で設定） */
function wrap(s,maxW){
  const out=[];
  s.split("\n").forEach(para=>{
    let line="";
    for(const ch of para){
      if(line&&ctx.measureText(line+ch).width>maxW&&!NO_START.includes(ch)){
        let carry="";
        while(line.length>1&&NO_END.includes(line[line.length-1])){carry=line[line.length-1]+carry;line=line.slice(0,-1);}
        out.push(line);line=carry+ch;
      }else line+=ch;
    }
    out.push(line);
  });
  return out;
}
/* 会話ウィンドウ用：文の切れ目でページを分け、1ページ maxLines 行に収める */
function paginate(s,maxW,maxLines){
  const sents=(s.match(/[^。！？!?\n]*(?:[。！？!?]+[」』）)]*|\n|$)/g)||[]).map(x=>x.trim()).filter(Boolean);
  const pages=[];let cur="";
  sents.forEach(x=>{
    if(cur&&wrap(cur+x,maxW).length<=maxLines){cur+=x;return;}
    if(cur)pages.push(wrap(cur,maxW));
    const ls=wrap(x,maxW);cur="";
    for(let i=0;i<ls.length;i+=maxLines){
      if(i+maxLines<ls.length)pages.push(ls.slice(i,i+maxLines));else cur=ls.slice(i).join("");
    }
  });
  if(cur)pages.push(wrap(cur,maxW));
  return pages.length?pages:[[""]];
}

}

/* 背景のらくがき星（イラストがないとき） */
const DOODLES=[[130,300,26,4],[955,250,20,5],[925,560,15,4],[105,700,18,5],[985,1000,22,4],[90,1080,16,4],[240,175,12,4],[860,420,10,4]];
function doodles(t,col,all,fade=1){
  ctx.strokeStyle=ctx.fillStyle=col;ctx.lineWidth=3;ctx.lineJoin=ctx.lineCap="round";
  if(all)DOODLES.forEach(([x,y,s,k],i)=>{
    ctx.globalAlpha=(.45+.45*Math.sin(t*1.7+i*1.3))*fade;
    if(k===4){star4(ctx,x,y,s);ctx.fill();}else{star5(ctx,x,y,s);ctx.stroke();}
  });
  const pts=[[780,140],[838,115],[905,153],[965,125]];
  ctx.globalAlpha=.6*fade;ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.setLineDash([]);
  pts.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();});
  ctx.globalAlpha=1;
}

function drawCard(cx,cy,w,flip,alpha,rot,shadow){
  if(alpha<=0)return;
  const T=th(),h=w*RATIO,ang=flip*Math.PI,sx=Math.abs(Math.cos(ang)),lift=1+.06*Math.sin(ang);
  const front=ang>Math.PI/2&&S.img;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.rotate(rot||0);ctx.scale(Math.max(sx,.002)*lift,lift);
  ctx.transform(1,.1*Math.sin(ang)*(ang>Math.PI/2?-1:1),0,1,0,0);
  if(shadow!==false){ctx.shadowColor="rgba(20,28,22,.35)";ctx.shadowBlur=w*.1;ctx.shadowOffsetY=w*.04;}
  rr(ctx,-w/2,-h/2,w,h,w*.056);ctx.fillStyle=front?"#1d1d1d":T.back;ctx.fill();
  ctx.shadowColor="transparent";
  if(front){if(S.rev)ctx.rotate(Math.PI);ctx.drawImage(S.img,-w/2,-h/2,w,h);}
  else ctx.drawImage(cardBack(),-w/2,-h/2,w,h);
  ctx.restore();
}

/* キャラの場面：イラストを上に、手前にテーブルクロス */
function scene(t){
  const T=th(),L=TL;
  if(S.chara){
    const c=S.charaTop;ctx.fillStyle=rgba(c,1);ctx.fillRect(0,0,W,H);
    const im=S.chara,k=Math.min(im.width,im.height),sx=(im.width-k)/2,sy=(im.height-k)/2;
    const z=IMG.s*(1+.05*prog(t,0,L.endIn)),y=IMG.y+IMG.s/2-z/2;
    ctx.drawImage(im,sx,sy,k,k,W/2-z/2,y,z,z);
    const f=ctx.createLinearGradient(0,y,0,y+80);f.addColorStop(0,rgba(c,1));f.addColorStop(1,rgba(c,0));
    ctx.fillStyle=f;ctx.fillRect(0,y,W,80);
    doodles(t,T.doodle,false);
  }else{
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,T.bgTop);g.addColorStop(1,T.bgBot);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const rg=ctx.createRadialGradient(540,760,60,540,760,900);rg.addColorStop(0,T.glow);rg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    doodles(t,T.doodle,true);
  }
  /* テーブルクロス */
  ctx.save();
  ctx.shadowColor="rgba(20,28,22,.25)";ctx.shadowBlur=30;ctx.shadowOffsetY=-6;
  ctx.fillStyle=T.table;ctx.fillRect(0,TABLE_Y,W,H-TABLE_Y);ctx.shadowColor="transparent";
  const r=mulberry(5);ctx.fillStyle=T.lace;
  for(let i=0;i<40;i++){ctx.globalAlpha=.12+r()*.2;star4(ctx,r()*W,TABLE_Y+60+r()*(H-TABLE_Y-60),4+r()*7);ctx.fill();}
  ctx.globalAlpha=1;
  for(let x=0;x<=W+36;x+=36){ctx.beginPath();ctx.arc(x,TABLE_Y,18,0,Math.PI);ctx.fill();}
  ctx.globalAlpha=.6;ctx.strokeStyle=T.lace;ctx.lineWidth=2;ctx.setLineDash([4,8]);
  ctx.beginPath();ctx.moveTo(0,TABLE_Y+34);ctx.lineTo(W,TABLE_Y+34);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
}

/* シャッフル（左右に割って重ね直す） */
function deck(t){
  const L=TL,N=DECK.n,inP=easeOut(prog(t,L.deckIn,L.deckIn+.6)),fade=1-prog(t,L.rise+.6,L.exit);
  if(inP<=0||fade<=0)return;
  const p=t>=L.shuf&&t<L.shufEnd?((t-L.shuf)%L.cyc)/L.cyc:0,s=Math.sin(Math.PI*p);
  for(let i=0;i<N;i++){
    if(i===N-1&&t>=L.rise)continue;
    const side=i%2?-1:1,mid=1-Math.abs(i-N/2)/N;
    drawCard(DECK.cx+side*s*135+(i-N/2)*1.5,DECK.cy+(1-inP)*460-s*28*mid-i*2,DECK.w,0,inP*fade,side*s*.16,i===0);
  }
}

/* 会話ウィンドウ（名前タブつき・1文字ずつ） */
function dialog(t){
  const T=th(),L=TL;
  const a=Math.max(prog(t,L.introIn,L.introIn+.3)*(1-prog(t,L.rise,L.rise+.35)),prog(t,L.pagesIn,L.pagesIn+.3));
  if(a<=0)return;
  const oy=(1-easeOut(a))*30;
  ctx.save();ctx.globalAlpha=a;
  ctx.font=jp(32);const tw=ctx.measureText(DEFAULTS.name).width+60;
  rr(ctx,BOX.x+34,BOX.y-50+oy,tw,74,18);ctx.fillStyle=T.box;ctx.fill();ctx.strokeStyle=T.boxLine;ctx.lineWidth=5;ctx.stroke();
  ctx.fillStyle=T.boxLine;ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(DEFAULTS.name,BOX.x+64,BOX.y-14+oy);
  ctx.shadowColor="rgba(20,28,22,.25)";ctx.shadowBlur=30;ctx.shadowOffsetY=10;
  ctx.fillStyle=T.box;rr(ctx,BOX.x,BOX.y+oy,BOX.w,BOX.h,22);ctx.fill();ctx.shadowColor="transparent";
  ctx.strokeStyle=T.boxLine;ctx.lineWidth=5;rr(ctx,BOX.x,BOX.y+oy,BOX.w,BOX.h,22);ctx.stroke();
  ctx.globalAlpha=a*.5;ctx.lineWidth=1.5;rr(ctx,BOX.x+12,BOX.y+12+oy,BOX.w-24,BOX.h-24,14);ctx.stroke();ctx.globalAlpha=a;
  const b=[...L.beats].reverse().find(x=>x.start<=t&&t<x.end);
  if(b){
    let left=Math.floor((t-b.start)*CPS);const total=[...b.lines.join("")].length;
    ctx.font=jp(TXT.size,400);ctx.fillStyle=T.ink;ctx.textBaseline="top";
    b.lines.forEach((line,i)=>{
      if(left<=0)return;const cs=[...line];
      ctx.fillText(cs.slice(0,left).join(""),TXT.x,TXT.y+i*TXT.lh+oy);left-=cs.length;
    });
    if((t-b.start)*CPS>=total&&Math.sin(t*9)>-.3){
      const x=BOX.x+BOX.w-52,y=BOX.y+BOX.h-46+oy+Math.sin(t*6)*3;
      ctx.fillStyle=T.boxLine;ctx.beginPath();ctx.moveTo(x-14,y-9);ctx.lineTo(x+14,y-9);ctx.lineTo(x,y+9);ctx.closePath();ctx.fill();
    }
  }
  ctx.restore();
}

/* 上の情報ボックス：最初は見出し、めくった後はカード名とキーワード */
function info(t){
  const T=th(),L=TL,c=MAJOR[S.card];
  const a1=prog(t,.1,.6)*(1-prog(t,L.rise,L.rise+.4)),a2=prog(t,L.exitEnd-.45,L.exitEnd+.15);

/* 文字の配置と尺は、文面やテーマが変わったときだけ計算する */
function relayout(){
  const c=MAJOR[S.card],L={};
  LAY={};
  ctx.font=jp(TXT.size,400);
  const introL=wrap(S.intro,TXT.w).slice(0,TXT.lines),readyL=wrap(DEFAULTS.ready,TXT.w).slice(0,TXT.lines);
  const pages=paginate(S.msg,TXT.w,TXT.lines);
  ctx.font=jp(46);LAY.outro=wrap(S.outro,880).slice(0,3);
  LAY.kw=(S.rev?c.kwR:c.kwU).split(/\s*・\s*/).slice(0,3).join("・");
  LAY.kwSize=fitSize(LAY.kw,s=>jp(s,400),30,22,770);
  ctx.font=jp(28);
  LAY.nameSize=fitSize(c.name,s=>jp(s),54,36,770-ctx.measureText("逆位置").width-60);
  L.introIn=.3;L.deckIn=.5;L.shuf=1.1;L.cyc=1.1;
  const introAt=.7,need=Math.max(2.2,introAt+[...introL.join("")].length/CPS+.9-L.shuf);
  L.shufEnd=L.shuf+Math.ceil(need/L.cyc-1e-6)*L.cyc;
  L.ready=L.shufEnd;L.rise=L.ready+.7;L.riseEnd=L.rise+1.4;
  L.exit=L.riseEnd+2.4;L.exitEnd=L.exit+1.0;L.pagesIn=L.exitEnd-.3;
  L.beats=[{lines:introL,start:introAt,end:L.ready},{lines:readyL,start:L.ready,end:L.rise+.4}];
  let s=L.exitEnd;
  pages.forEach(p=>{const n=[...p.join("")].length,d=n/CPS+Math.max(1.6,n*.05+.9);L.beats.push({lines:p,start:s,end:s+d});s+=d;});
  L.endIn=s;L.end=s+3.8;
  TL=L;
  $("seek").max=L.end.toFixed(2);
}

function render(t){
  const T=th(),L=TL,c=MAJOR[S.card];
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowColor="transparent";ctx.textBaseline="alphabetic";ctx.textAlign="center";
  scene(t);
  deck(t);

  ctx.globalAlpha=.85;ctx.fillStyle=T.mark;ctx.font=en(36,true);ctx.textAlign="left";ctx.fillText(S.handle,70,452);ctx.textAlign="center";ctx.globalAlpha=1;
  info(t);
  dialog(t);

  /* めくる場面：背景を落として、カードを画面いっぱいに */
  const dim=prog(t,L.rise,L.rise+.8)*(1-prog(t,L.exit,L.exitEnd));
  if(dim>0){ctx.globalAlpha=dim;ctx.fillStyle=T.dim;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(t>=L.rise){
    const r=easeIO(prog(t,L.rise,L.riseEnd)),x=easeIO(prog(t,L.exit,L.exitEnd)),fp=easeIO(prog(t,L.rise+.5,L.riseEnd));
    const top={cx:DECK.cx+(DECK.n/2-1)*1.5,cy:DECK.cy-(DECK.n-1)*2};
    let cx=lerp(top.cx,BIG.cx,r),cy=lerp(top.cy,BIG.cy,r)-Math.sin(Math.PI*r)*70,w=lerp(DECK.w,BIG.w,r);
    cy+=Math.sin((t-L.riseEnd)*2)*8*(t>L.riseEnd?1:0)*(1-x);
    const glow=prog(t,L.rise+.9,L.riseEnd+.3)*(1-x);
    if(glow>0){
      const gg=ctx.createRadialGradient(cx,cy,w*.2,cx,cy,w*1.2);gg.addColorStop(0,T.cardGlow);gg.addColorStop(1,"rgba(255,255,255,0)");
      ctx.globalAlpha=glow*.7;ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    }
    snow(t,prog(t,L.rise+.9,L.riseEnd+.4)*(1-prog(t,L.exit,L.exit+.6)));
    const burst=Math.exp(-Math.pow((t-(L.rise+.95))/.28,2));
    sparkles(cx,cy,w,prog(t,L.riseEnd,L.riseEnd+.5)*(1-x)*.8,burst,t);
    drawCard(lerp(cx,THUMB.cx,x),lerp(cy,THUMB.cy,x),lerp(w,THUMB.w,x),fp,1,-.2*Math.sin(Math.PI*r),true);
    /* カード名の札 */
    const la=easeOut(prog(t,L.riseEnd-.2,L.riseEnd+.4))*(1-prog(t,L.exit,L.exit+.35));
    if(la>0){
      ctx.globalAlpha=la;const ori=S.rev?"逆位置":"正位置";
      const parts=[[`No.${c.num}　`,en(40),T.accent],[c.name,jp(Math.min(56,LAY.nameSize+6)),T.ink],["　"+ori,jp(36),T.inkDim]];
      const pw=parts.reduce((s,[x,f])=>{ctx.font=f;return s+ctx.measureText(x).width;},0)+90;
      ctx.fillStyle=T.paper;rr(ctx,540-pw/2,248,pw,96,48);ctx.fill();
      runs(parts,540,314);
      ctx.globalAlpha=1;
    }
  }
  ending(t);
  ctx.globalAlpha=1;ctx.drawImage(grain(),0,0);
}

/* イラストの上端の色。画面の上の余白をこの色で埋めてつなげる */
function edgeColor(im){
  const c=document.createElement("canvas");c.width=c.height=32;const g=c.getContext("2d");
  g.drawImage(im,0,0,32,32);const d=g.getImageData(0,0,32,3).data,s=[0,0,0];
  for(let i=0;i<d.length;i+=4){s[0]+=d[i];s[1]+=d[i+1];s[2]+=d[i+2];}
  return s.map(v=>Math.round(v/(d.length/4)));
}

let cur=0,playing=false,t0=0;

}

/* ================= 書き出し ================= */
async function encodeMp4(onP){
  if(!("VideoEncoder" in window)||!window.Mp4Muxer)return null;
  const base={width:W,height:H,bitrate:8e6,framerate:FPS};let cfg=null;
  for(const codec of ["avc1.640028","avc1.4d0028","avc1.420028"]){
    try{if((await VideoEncoder.isConfigSupported({...base,codec})).supported){cfg={...base,codec};break;}}catch(e){}
  }
  if(!cfg)return null;
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:"avc",width:W,height:H,frameRate:FPS},fastStart:"in-memory"});
  let err=null;
  const enc=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>{err=e;}});
  enc.configure(cfg);
  const n=Math.ceil(TL.end*FPS);
  for(let i=0;i<n;i++){
    if(err)throw err;
    render(i/FPS);
    const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
    enc.encode(f,{keyFrame:i%(FPS*2)===0});f.close();
    while(enc.encodeQueueSize>4)await new Promise(r=>setTimeout(r,4));
    if(i%6===0){onP(i/n);await new Promise(r=>setTimeout(r,0));}
  }
  await enc.flush();if(err)throw err;enc.close();muxer.finalize();
  return new Blob([muxer.target.buffer],{type:"video/mp4"});
}
/* WebCodecs が使えない端末向け：実時間で再生しながら録画する */
function recordRealtime(onP){
  return new Promise((ok,ng)=>{
    if(!cv.captureStream||!window.MediaRecorder)return ng(new Error("この端末のブラウザは動画の書き出しに対応していません"));
    const mime=["video/mp4;codecs=avc1.640028","video/mp4","video/webm;codecs=vp9","video/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"";
    const rec=new MediaRecorder(cv.captureStream(FPS),mime?{mimeType:mime,videoBitsPerSecond:8e6}:{});
    const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    rec.onstop=()=>ok(new Blob(chunks,{type:(rec.mimeType||mime||"video/webm").split(";")[0]}));
    rec.onerror=e=>ng(e.error||new Error("録画に失敗しました"));
    render(0);rec.start(250);
    const start=performance.now();
    (function step(now){
      const t=(now-start)/1000;render(Math.min(t,TL.end));onP(t/TL.end);
      if(t<TL.end)requestAnimationFrame(step);else setTimeout(()=>rec.stop(),200);
    })(start);
  });
}

let outUrl=null;

function lock(on){document.querySelectorAll(".controls input,.controls select,.controls textarea,.controls button,.player input,.player button").forEach(e=>{e.disabled=on;});}
async function exportVideo(){
  play(false);lock(true);
  $("progress").hidden=false;$("result").hidden=true;
  const setP=p=>{$("bar").style.width=Math.round(clamp(p)*100)+"%";};
  $("status").textContent="準備しています…";setP(0);
  let blob=null;
  try{
    await loadFonts();
    if(!S.img){S.img=imgCache[S.card]=await loadImg(`../${CARD_FILES[S.card]}.png`);}
    relayout();
    $("status").textContent="動画を作っています…";
    try{blob=await encodeMp4(setP);}catch(e){console.warn(e);blob=null;}
    if(!blob){$("status").textContent="録画しています…（このまま画面を開いておいてください）";blob=await recordRealtime(setP);}
  }catch(e){
    $("status").textContent="書き出せませんでした："+(e&&e.message||e);lock(false);return;
  }
  setP(1);
  const ext=blob.type.includes("mp4")?"mp4":"webm";
  const d=new Date(),name=`reel-${d.getMonth()+1}${String(d.getDate()).padStart(2,"0")}-${CARD_FILES[S.card].slice(3)}.${ext}`;
  if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(blob);
  $("out").src=outUrl;$("download").href=outUrl;$("download").download=name;
  const file=new File([blob],name,{type:blob.type});
  $("share").hidden=!(navigator.canShare&&navigator.canShare({files:[file]}));
  $("share").onclick=()=>navigator.share({files:[file]}).catch(()=>{});
  $("result-note").textContent=ext==="mp4"
    ?`できました（${TL.end.toFixed(1)}秒・MP4）。スマホは「保存・共有する」から「ビデオを保存」で写真に入ります。`
    :"この端末ではWebM形式になりました。Instagramに上げる前にMP4へ変換するか、iPhoneのSafariかパソコンのChromeで書き出してください。";
  $("status").textContent="";$("progress").hidden=true;$("result").hidden=false;lock(false);
  play(false);cur=0;draw();
}

  $("chara-clear").addEventListener("click",async()=>{await setChara(null,true);tryRepoChara();});
  $("export").addEventListener("click",exportVideo);

  randomCard();
  if(p.chara)setChara(p.chara,true).then(ok=>{if(!ok)tryRepoChara();});else tryRepoChara();
  loadFonts().then(()=>{if(!playing){cur=0;play(true);}});
})();
async function tryRepoChara(){for(const f of CHARA_FILES){if(await setChara(f,false))return;}}
</script>
