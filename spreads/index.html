<style>
:root{
  --night-deep:#0b0e1e;
  --night:#131735;
  --night-soft:#1c2148;
  --gold:#d8b46a;
  --gold-bright:#f0d69a;
  --gold-dim:rgba(216,180,106,.38);
  --ink:#ece6d8;
  --ink-dim:#a9a293;
  --violet:#6f5fae;
  --violet-glow:rgba(140,120,220,.55);
  --card-w:64px;
  --card-h:100px;
  --serif-jp:'Noto Serif JP',serif;
  --serif-en:'Cormorant Garamond',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--serif-jp);
  background:radial-gradient(ellipse at 50% -10%, #232a58 0%, var(--night) 45%, var(--night-deep) 100%);
  color:var(--ink);
  overflow-x:hidden;
  min-height:100dvh;
  letter-spacing:.04em;
}
/* ---------- 星空 ---------- */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:twinkle var(--d,4s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}
}
/* ---------- 共通 ---------- */
.screen{position:relative;z-index:1;min-height:100dvh;display:none;flex-direction:column;align-items:center;padding:22px 16px 40px}
.screen.active{display:flex}
.brand{font-family:var(--serif-en);font-size:.72rem;letter-spacing:.5em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:6px}
h1{font-weight:500;font-size:1.5rem;letter-spacing:.28em;color:var(--gold-bright);text-align:center}
.subtitle{font-size:.78rem;color:var(--ink-dim);margin-top:10px;text-align:center;line-height:1.9}
.gold-rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto}
button{font-family:var(--serif-jp);cursor:pointer;letter-spacing:.12em}
.btn-gold{
  background:linear-gradient(160deg,rgba(216,180,106,.16),rgba(216,180,106,.06));
  border:1px solid var(--gold-dim);color:var(--gold-bright);
  padding:13px 34px;border-radius:999px;font-size:.92rem;
  transition:all .35s;
}
.btn-gold:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(216,180,106,.25)}
.btn-ghost{background:none;border:1px solid rgba(236,230,216,.22);color:var(--ink-dim);padding:11px 26px;border-radius:999px;font-size:.82rem;transition:all .3s}
.btn-ghost:hover{color:var(--ink);border-color:rgba(236,230,216,.5)}
/* ---------- スプレッド選択 ---------- */
#screen-select .spread-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;width:100%;max-width:960px;margin-top:26px;
}
.spread-card{
  position:relative;
  background:linear-gradient(170deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  border:1px solid rgba(216,180,106,.22);
  border-radius:14px;padding:22px 20px 18px;text-align:left;
  color:var(--ink);transition:all .4s;overflow:hidden;
}
.spread-card:hover,.spread-card:focus-visible{
  border-color:var(--gold);transform:translateY(-3px);
  box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 20px rgba(216,180,106,.12);
}
.spread-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.spread-card .sc-count{
  position:absolute;top:16px;right:18px;font-family:var(--serif-en);
  font-size:.7rem;letter-spacing:.2em;color:var(--gold-dim);
}
.spread-card h3{font-size:1.05rem;font-weight:500;letter-spacing:.16em;color:var(--gold-bright);margin-bottom:2px}
.spread-card .sc-en{font-family:var(--serif-en);font-size:.72rem;letter-spacing:.3em;color:var(--ink-dim);margin-bottom:12px}
.spread-card .sc-desc{font-size:.8rem;line-height:1.9;color:var(--ink-dim)}
.spread-card .sc-mini{
  margin-top:14px;height:66px;position:relative;
  border-top:1px dashed rgba(216,180,106,.18);padding-top:10px;
}
.sc-mini .m-dot{
  position:absolute;width:12px;height:18px;border-radius:2px;
  border:1px solid var(--gold-dim);background:rgba(111,95,174,.25);
  transform:translate(-50%,-50%);
}
.sc-mini .m-dot.rot{transform:translate(-50%,-50%) rotate(90deg)}
/* 会員限定のスプレッド */
.spread-card.locked{opacity:.72}
.spread-card.locked:hover,.spread-card.locked:focus-visible{
  transform:none;border-color:rgba(216,180,106,.22);box-shadow:none;
}
.spread-card .sc-lock{
  position:absolute;top:36px;right:18px;
  display:inline-flex;align-items:center;gap:5px;
  font-size:.62rem;letter-spacing:.14em;color:var(--gold);
  border:1px solid var(--gold-dim);border-radius:999px;
  padding:3px 10px;background:rgba(216,180,106,.06);
}
.spread-card .sc-lock svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.7;flex:none}
/* 会員限定モーダル */
#gate{
  position:fixed;inset:0;z-index:50;padding:24px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(11,14,30,.9);
  opacity:0;pointer-events:none;transition:opacity .45s;
}
#gate.show{opacity:1;pointer-events:auto}
.gate-box{
  width:100%;max-width:376px;text-align:center;padding:32px 26px 26px;
  background:linear-gradient(170deg,#1b1f45 0%, #141833 100%);
  border:1px solid var(--gold-dim);border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 30px rgba(216,180,106,.06);
  transform:translateY(14px) scale(.985);
  transition:transform .45s cubic-bezier(.25,.9,.3,1);
}
#gate.show .gate-box{transform:none}
.gate-box .gate-mark{font-size:.86rem;letter-spacing:.34em;color:var(--gold);opacity:.75}
.gate-box h2{font-size:.92rem;font-weight:500;letter-spacing:.28em;color:var(--gold-bright);margin-top:12px}
.gate-box .gate-text{font-size:.82rem;line-height:2.1;color:var(--ink-dim);margin-top:4px;text-wrap:balance}
.gate-box .gate-text .gt-name{color:var(--ink)}
.gate-actions{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.btn-gate-line{
  display:block;text-decoration:none;text-align:center;
  background:linear-gradient(160deg,rgba(216,180,106,.16),rgba(216,180,106,.06));
  border:1px solid var(--gold-dim);color:var(--gold-bright);
  padding:13px 20px;border-radius:999px;font-size:.84rem;letter-spacing:.12em;
  transition:all .35s;
}
.btn-gate-line:hover,.btn-gate-line:focus-visible{border-color:var(--gold);box-shadow:0 0 24px rgba(216,180,106,.22)}
.btn-gate-close{
  background:none;border:1px solid rgba(236,230,216,.2);color:var(--ink-dim);
  padding:12px 20px;border-radius:999px;font-size:.8rem;transition:all .3s;
}
.btn-gate-close:hover,.btn-gate-close:focus-visible{color:var(--ink);border-color:rgba(236,230,216,.45)}
/* ---------- 問い入力 ---------- */
#screen-ask{justify-content:center}
.ask-box{width:100%;max-width:480px;text-align:center}
.ask-box .spread-label{font-size:.8rem;color:var(--gold);letter-spacing:.3em;margin-bottom:8px}
textarea#question{
  width:100%;min-height:96px;margin-top:20px;
  background:rgba(255,255,255,.04);border:1px solid rgba(216,180,106,.25);
  border-radius:10px;padding:14px;color:var(--ink);font-family:var(--serif-jp);
  font-size:.9rem;line-height:1.9;resize:vertical;letter-spacing:.05em;
}
textarea#question:focus{outline:none;border-color:var(--gold);box-shadow:0 0 16px rgba(216,180,106,.12)}
.ask-note{font-size:.72rem;color:var(--ink-dim);margin-top:10px;line-height:1.8}
.ask-actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
/* ---------- テーブル ---------- */
#screen-table{padding:14px 8px 0;overflow:hidden;justify-content:flex-start}
.table-head{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-bottom:6px}
.table-head .th-spread{font-size:.78rem;letter-spacing:.24em;color:var(--gold)}
.table-head .th-count{font-family:var(--serif-en);font-size:.74rem;letter-spacing:.18em;color:var(--ink-dim)}
#dealer{
  width:120px;height:54px;margin:0 auto 2px;position:relative;opacity:.55;
  animation:dealerSway 7s ease-in-out infinite;
}
@keyframes dealerSway{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
#dealer::before{
  content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:84px;height:50px;background:radial-gradient(ellipse at 50% 100%, #2a2f5c 0%, transparent 72%);
  border-radius:50% 50% 0 0;
}
#dealer::after{
  content:'';position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%, #343a6e 0%, #1a1e42 70%, transparent 100%);
}
#table-area{
  position:relative;width:min(94vw,540px);aspect-ratio:1/1.06;margin:0 auto;
}
#round-table{
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 50% 34%, rgba(140,120,220,.14), transparent 62%),
    radial-gradient(circle at 50% 50%, #1e2350 0%, #161a3e 58%, #10132c 100%);
  border:2px solid var(--gold-dim);
  box-shadow:
    inset 0 0 60px rgba(0,0,0,.55),
    inset 0 0 18px rgba(216,180,106,.08),
    0 24px 60px rgba(0,0,0,.55);
}
#round-table::before{
  content:'';position:absolute;inset:10px;border-radius:50%;
  border:1px solid rgba(216,180,106,.18);
}
/* スプレッド位置ガイド */
.slot{
  position:absolute;width:var(--card-w);height:var(--card-h);pointer-events:none;
  transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(var(--sc,1));
  border:1px dashed rgba(216,180,106,.34);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .4s, box-shadow .4s;
}
.slot .slot-label{
  font-size:.56rem;color:var(--gold-dim);letter-spacing:.1em;text-align:center;
  line-height:1.5;padding:2px;transform:rotate(calc(var(--rot,0deg) * -1));
}
.slot.next{border-color:var(--gold);box-shadow:0 0 14px rgba(216,180,106,.3);animation:slotPulse 1.6s ease-in-out infinite}
@keyframes slotPulse{0%,100%{box-shadow:0 0 8px rgba(216,180,106,.18)}50%{box-shadow:0 0 20px rgba(216,180,106,.42)}}
/* カード */
.tcard{
  position:absolute;width:var(--card-w);height:var(--card-h);
  transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(var(--sc,1));
  transform-style:preserve-3d;perspective:600px;
  transition:left .8s cubic-bezier(.22,.9,.3,1), top .8s cubic-bezier(.22,.9,.3,1), transform .8s cubic-bezier(.22,.9,.3,1);
  z-index:5;cursor:pointer;
}
.tcard-inner{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.3,.1,.25,1);
  border-radius:6px;
}
.tcard.open .tcard-inner{transform:rotateY(180deg)}
.tface{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tback{
  background:
    radial-gradient(circle at 50% 26%, rgba(240,214,154,.2) 0%, transparent 28%),
    linear-gradient(155deg,#3a3170 0%, #241f52 55%, #171338 100%);
  border:1px solid var(--gold-dim);
  box-shadow:0 6px 16px rgba(0,0,0,.5);
}
.tback::before{
  content:'☽';position:absolute;top:16%;left:50%;transform:translateX(-50%);
  color:var(--gold);font-size:14px;opacity:.85;
}
.tback::after{
  content:'✦ ✧ ✦';position:absolute;bottom:14%;left:50%;transform:translateX(-50%);
  color:var(--gold-dim);font-size:8px;letter-spacing:2px;
}
.tfront{
  transform:rotateY(180deg);
  background:linear-gradient(168deg,#f4ecd8 0%, #e7dcc0 100%);
  border:1px solid #b99a55;color:#3a3050;
  box-shadow:0 6px 16px rgba(0,0,0,.5);
  padding:4px 2px;
}
.tfront .tf-num{font-family:var(--serif-en);font-size:.52rem;letter-spacing:.12em;color:#8a7440}
.tfront .tf-sym{font-size:20px;line-height:1.35;margin:2px 0;color:#4c3f78}
.tfront .tf-name{font-size:.5rem;font-weight:600;letter-spacing:.04em;text-align:center;line-height:1.35;color:#463a66;padding:0 2px}
.tfront .tf-rev{font-size:.44rem;color:#a0522d;letter-spacing:.1em;margin-top:1px}
.tcard.reversed .tfront{transform:rotateY(180deg) rotate(180deg)}
/* 山札の扇 */
#slots{position:absolute;inset:0;z-index:1;pointer-events:none}
#cards-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
#cards-layer .tcard{pointer-events:none}
#cards-layer.can-flip .tcard{pointer-events:auto}
#deck-fan{position:absolute;left:0;bottom:-4%;width:100%;height:30%;pointer-events:none;z-index:3;transition:opacity .7s, transform .7s}
#deck-fan.fan-out{opacity:0;transform:translateY(60px);pointer-events:none}
#deck-fan.fan-out .fan-card{pointer-events:none}
.fan-card{
  position:absolute;left:50%;bottom:6px;width:54px;height:86px;border-radius:5px;
  background:linear-gradient(155deg,#38306c 0%, #221d4e 60%, #151134 100%);
  border:1px solid rgba(216,180,106,.45);
  transform-origin:50% 200%;
  transform:translateX(-50%) rotate(var(--a)) translateY(var(--lift,0px));
  box-shadow:0 4px 12px rgba(0,0,0,.5);
  pointer-events:auto;cursor:pointer;
  transition:transform .3s, box-shadow .3s, opacity .4s;
}
.fan-card::before{content:'☽';position:absolute;top:8px;left:50%;transform:translateX(-50%);color:var(--gold-dim);font-size:10px}
.fan-card:hover,.fan-card:focus-visible{--lift:-16px;z-index:30!important;box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 14px var(--violet-glow)}
.fan-card.drawn{opacity:0;pointer-events:none;transition:opacity .4s}
.table-foot{display:flex;gap:10px;justify-content:center;margin:14px 0 20px;flex-wrap:wrap;position:relative;z-index:6}
.hint{font-size:.72rem;color:var(--ink-dim);text-align:center;letter-spacing:.14em;margin-top:4px;min-height:1.4em}
/* ---------- 鑑定パネル ---------- */
#panel{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  max-height:86dvh;transform:translateY(102%);
  transition:transform .7s cubic-bezier(.25,.9,.3,1);
  background:linear-gradient(180deg,#191d40 0%, #121531 100%);
  border-top:1px solid var(--gold-dim);
  border-radius:22px 22px 0 0;
  box-shadow:0 -18px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
}
#panel.show{transform:translateY(0)}
#panel-grip{
  padding:12px 0 8px;text-align:center;cursor:pointer;flex:none;
}
#panel-grip::before{
  content:'';display:block;width:44px;height:3px;border-radius:3px;
  background:var(--gold-dim);margin:0 auto;
}
#panel-body{overflow-y:auto;padding:4px 20px 46px;-webkit-overflow-scrolling:touch}
.p-inner{max-width:640px;margin:0 auto}
.p-head{text-align:center;margin-bottom:8px}
.p-head .p-spread{font-size:.72rem;letter-spacing:.34em;color:var(--gold)}
.p-head .p-q{font-size:.85rem;color:var(--ink);margin-top:10px;line-height:1.9}
.p-head .p-q::before{content:'「'}.p-head .p-q::after{content:'」'}
.reading{
  border:1px solid rgba(216,180,106,.2);border-radius:12px;
  padding:18px 18px 16px;margin-top:18px;
  background:linear-gradient(170deg,rgba(255,255,255,.03),transparent);
}
.reading .r-pos{font-size:.68rem;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
.reading .r-posmean{font-size:.72rem;color:var(--ink-dim);line-height:1.8;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed rgba(216,180,106,.16)}
.reading h4{font-size:1.02rem;font-weight:500;letter-spacing:.1em;color:var(--gold-bright)}
.reading .r-en{font-family:var(--serif-en);font-size:.7rem;letter-spacing:.22em;color:var(--ink-dim);margin-top:2px}
.reading .r-ori{display:inline-block;font-size:.66rem;letter-spacing:.2em;margin-top:8px;padding:3px 12px;border-radius:999px;border:1px solid var(--gold-dim);color:var(--gold-bright)}
.reading .r-ori.rev{border-color:rgba(190,110,90,.55);color:#dfa08c}
.reading .r-kw{font-size:.74rem;color:var(--ink-dim);letter-spacing:.14em;margin-top:10px}
.reading .r-body{font-size:.87rem;line-height:2.15;margin-top:12px;color:var(--ink)}
.reading .r-struct{
  margin-top:14px;padding:12px 14px;border-radius:8px;
  background:rgba(111,95,174,.12);border:1px solid rgba(140,120,220,.25);
  font-size:.72rem;line-height:2;color:#c9c2e8;letter-spacing:.06em;
}
.reading .r-struct .rs-t{font-size:.64rem;letter-spacing:.3em;color:#9d92cf;display:block;margin-bottom:4px}
.synth{
  margin-top:26px;border-top:1px solid var(--gold-dim);padding-top:22px;
}
.synth h3{font-size:.8rem;letter-spacing:.4em;color:var(--gold);text-align:center;margin-bottom:16px}
.synth .s-item{margin-top:14px}
.synth .s-label{font-size:.66rem;letter-spacing:.26em;color:#9d92cf}
.synth .s-text{font-size:.85rem;line-height:2.1;margin-top:4px}
.synth .s-story{
  margin-top:22px;padding:18px;border:1px solid rgba(216,180,106,.28);border-radius:12px;
  font-size:.9rem;line-height:2.2;text-align:center;color:var(--gold-bright);
  background:radial-gradient(circle at 50% 0%, rgba(216,180,106,.08), transparent 70%);
}
.p-actions{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.p-actions-sub{margin-top:14px}
/* シェア（金の細枠・主役のコピーボタンと競合させない） */
.btn-share{
  display:inline-flex;align-items:center;gap:9px;
  background:none;border:1px solid var(--gold-dim);color:var(--gold);
  padding:11px 22px;border-radius:999px;font-size:.8rem;
  transition:all .3s;
}
.btn-share:hover,.btn-share:focus-visible{
  color:var(--gold-bright);border-color:var(--gold);
  box-shadow:0 0 16px rgba(216,180,106,.16);
}
.btn-share svg{width:12px;height:12px;fill:currentColor;flex:none;opacity:.9}
.btn-share svg.stroke{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.p-close-line{text-align:center;margin-top:26px;font-family:var(--serif-en);font-size:.66rem;letter-spacing:.5em;color:var(--gold-dim)}
/* ---------- パネル末尾のフッター ---------- */
.p-footer{text-align:center;margin-top:18px}
.p-footer .pf-rule{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:0 auto 18px}
.p-footer .pf-link{
  display:inline-block;font-size:.76rem;letter-spacing:.16em;
  color:var(--gold-dim);text-decoration:none;transition:color .35s;
}
.p-footer .pf-link::after{content:' →';font-size:.7rem;letter-spacing:0}
.p-footer .pf-link:hover,.p-footer .pf-link:focus-visible{color:var(--gold-bright)}

}

     "恋愛、創作、楽しみ。心が躍ることとの関わり。",
     "仕事の実務、日課、健康。毎日の営みの調子。",
     "パートナー、一対一の関係。あなたの前に立つ人。",
     "深い信頼、共有する資源、受け継ぐもの。",
     "探究、学問、旅、遠い世界。視野を広げる方向。",
     "社会的な立場、キャリア、目指す頂。",
     "友人、仲間、コミュニティ。未来への願い。",
     "心の奥、ひとりの時間、秘めていること。見えない土台。"];
    const arr=houses.map((h,i)=>{
      const p=circlePos(i,12,40,50,48,180,-1);
      return {label:h,x:+p.x.toFixed(1),y:+(p.y*0.98).toFixed(1),meaning:means[i]};
    });
    arr.push({label:"中央｜全体のテーマ",x:50,y:47,meaning:"十二の領域を貫く、いまのあなたの通奏低音。全体を束ねる一枚。"});
    return arr;
  })()
 }
};

/* ================= デッキ生成 ================= */
function buildDeck(){
  const deck=[];
  MAJOR.forEach((m,i)=>deck.push({type:"major",idx:i}));
  Object.keys(SUITS).forEach(sk=>{
    for(let r=1;r<=14;r++) deck.push({type:"minor",suit:sk,rank:r});
  });
  return deck;
}
function cardInfo(c){
  if(c.type==="major"){
    const m=MAJOR[c.idx];
    return {name:m.name,en:m.en,num:m.num,sym:m.sym,kwU:m.kwU,kwR:m.kwR,isMajor:true,major:m};
  }
  const s=SUITS[c.suit], r=RANKS[c.rank], kw=MINOR_KW[c.suit][c.rank-1];
  return {name:`${s.name}の${r.label}`,en:`${r.en} of ${s.en}`,
    num:s.sym,sym:s.mark,kwU:kw[0],kwR:kw[1],isMajor:false,suitData:s,rankData:r};
}
function minorBody(c,rev){
  const s=SUITS[c.suit], r=RANKS[c.rank];
  const base=rev?r.rev:r.up;
  return `${s.name}は${s.el}のエレメント——${s.lens}を映すスートです。その${r.label}は、${r.stageText}。ここでは${s.field}のあたりで、この段階のことが起きていると読めます。${base}`;
}

/* ================= テーブル ================= */
let fullDeck=[];
function setupTable(){
  state.drawn=[];state.openCount=0;state.phase="draw";
  closePanel(true);
  fullDeck=buildDeck();
  const sp=state.spread;
  $("th-spread").textContent=sp.name;
  updateCount();
  // slots
  const slots=$("slots");slots.innerHTML="";
  sp.pos.forEach((p,i)=>{
    const d=document.createElement("div");d.className="slot";d.id="slot-"+i;
    d.style.left=p.x+"%";d.style.top=p.y+"%";
    d.style.setProperty("--rot",(p.rot||0)+"deg");
    d.style.setProperty("--sc",sp.sc);
    d.innerHTML=`<span class="slot-label">${p.label.split("｜")[0]}</span>`;
    slots.appendChild(d);
  });
  markNextSlot();
  // fan
  const fan=$("deck-fan");fan.innerHTML="";
  fan.classList.remove("fan-out");
  $("btn-draw-all").style.display="";
  $("btn-draw-all").textContent="残りを一気に引く";
  $("btn-show-panel").style.display="none";
  if(autoFlipTimer){clearInterval(autoFlipTimer);autoFlipTimer=null;}
  const N=18,spreadDeg=132;
  for(let i=0;i<N;i++){
    const f=document.createElement("button");f.className="fan-card";
    f.setAttribute("aria-label","山札からカードを引く");
    f.style.setProperty("--a",(-spreadDeg/2+i*(spreadDeg/(N-1))).toFixed(1)+"deg");
    f.style.zIndex=i;
    f.addEventListener("click",()=>drawOne(f));
    fan.appendChild(f);
  }
  $("cards-layer").innerHTML="";
  $("cards-layer").classList.remove("can-flip");
  $("hint").textContent="山札に触れて、一枚ずつ引いてください";
}
function updateCount(){
  $("th-count").textContent=`${state.drawn.length} / ${state.spread.cards}`;
}
function markNextSlot(){
  document.querySelectorAll(".slot").forEach(s=>s.classList.remove("next"));
  const n=state.drawn.length;
  if(n<state.spread.cards){const s=$("slot-"+n);if(s)s.classList.add("next");}
}
function drawOne(fanEl){
  if(state.phase!=="draw")return;
  const sp=state.spread;
  if(state.drawn.length>=sp.cards)return;
  const idx=Math.floor(Math.random()*fullDeck.length);
  const card=fullDeck.splice(idx,1)[0];
  const rev=Math.random()<0.5;
  const posIndex=state.drawn.length;
  state.drawn.push({card,rev,pos:sp.pos[posIndex]});
  if(fanEl){fanEl.classList.add("drawn");}
  else{
    const rest=[...document.querySelectorAll(".fan-card:not(.drawn)")];
    if(rest.length)rest[Math.floor(Math.random()*rest.length)].classList.add("drawn");
  }
  spawnCard(posIndex);
  updateCount();markNextSlot();
  if(state.drawn.length>=sp.cards){
    state.phase="flip";
    $("deck-fan").classList.add("fan-out");
    $("cards-layer").classList.add("can-flip");
    $("hint").textContent="すべて配られました。カードが順にひらきます——";
    $("btn-draw-all").style.display="none";
    setTimeout(startAutoFlip,900);
  }
}
let autoFlipTimer=null;
function startAutoFlip(){
  if(state.phase!=="flip")return;
  let i=0;
  autoFlipTimer=setInterval(()=>{
    while(i<state.spread.cards){
      const el=$("card-"+i);
      if(el&&!el.classList.contains("open"))break;
      i++;
    }
    if(i>=state.spread.cards){clearInterval(autoFlipTimer);autoFlipTimer=null;return;}
    flipCard(i);i++;
  },480);
}
function spawnCard(i){
  const d=state.drawn[i],sp=state.spread,info=cardInfo(d.card);
  const el=document.createElement("div");
  el.className="tcard"+(d.rev?" reversed":"");
  el.id="card-"+i;
  el.style.left="50%";el.style.top="104%";
  el.style.setProperty("--rot","0deg");
  el.style.setProperty("--sc",sp.sc);
  el.innerHTML=`<div class="tcard-inner">
    <div class="tface tback"></div>
    <div class="tface tfront">
      <span class="tf-num">${info.num}</span>
      <span class="tf-sym">${info.sym}</span>
      <span class="tf-name">${info.name}</span>
      ${d.rev?'<span class="tf-rev">逆位置</span>':''}
    </div></div>`;
  el.addEventListener("click",()=>flipCard(i));
  $("cards-layer").appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.left=d.pos.x+"%";el.style.top=d.pos.y+"%";
    el.style.setProperty("--rot",(d.pos.rot||0)+"deg");
  }));
}
function flipCard(i){
  if(state.phase!=="flip"&&state.phase!=="done")return;
  const el=$("card-"+i);
  if(!el||el.classList.contains("open"))return;
  el.classList.add("open");
  state.openCount++;
  if(state.openCount>=state.spread.cards&&state.phase==="flip"){
    state.phase="done";
    if(autoFlipTimer){clearInterval(autoFlipTimer);autoFlipTimer=null;}
    $("hint").textContent="";
    $("btn-show-panel").style.display="";
    setTimeout(showVeilThenPanel,900);
  }
}
$("btn-draw-all").addEventListener("click",()=>{
  if(state.phase!=="draw")return;
  let guard=0;
  const t=setInterval(()=>{
    if(state.phase!=="draw"){clearInterval(t);return;}
    drawOne(null);guard++;
    if(state.drawn.length>=state.spread.cards||guard>80)clearInterval(t);
  },240);
});
$("btn-show-panel").addEventListener("click",()=>{
  if($("panel-content").innerHTML)openPanel();
  else showVeilThenPanel();
});
$("btn-restart-table").addEventListener("click",()=>{show("screen-select");closePanel(true);});

function showVeilThenPanel(){
  const v=$("veil");v.classList.add("show");
  setTimeout(()=>{
    buildPanel();
    v.classList.remove("show");
    openPanel();
  },1600);
}

/* ================= 鑑定生成 ================= */
function readingFor(d,posIndex){
  const info=cardInfo(d.card);
  const ori=d.rev?ORI[1]:ORI[0];
  const kw=d.rev?info.kwR:info.kwU;
  let body,structLines=[];
  if(info.isMajor){
    body=(d.rev?info.major.rev:info.major.up);
    structLines.push(`大アルカナ ${info.num}番 —— 人生の大きなテーマを示す切り札`);
    structLines.push(`${ori} × 「${d.pos.label.split("｜")[0]}」の位置`);
  }else{
    body=minorBody(d.card,d.rev);
    const s=info.suitData,r=info.rankData;
    structLines.push(`スート：${s.name}（${s.el}）＝ ${s.domain} の領域`);
    structLines.push(`${r.court?"人物札":"数"}：${r.label} ＝ ${r.stage} の段階`);
    structLines.push(`${ori} × 「${d.pos.label.split("｜")[0]}」の位置`);
  }
  const posLine=`「${d.pos.label.split("｜")[0]}」の位置に${ori}で出たこの一枚は、そこに「${kw.split("・")[0].trim()}」の気配が流れていることを示しています。`;
  return {info,ori,kw,body,structLines,posLine};
}
function synthesize(){
  const sp=state.spread,ds=state.drawn;
  const majors=ds.filter(d=>d.card.type==="major");
  const revs=ds.map((d,i)=>d.rev?i:-1).filter(i=>i>=0);
  const elCount={火:0,水:0,風:0,地:0};
  const nums=[];
  ds.forEach(d=>{
    if(d.card.type==="minor"){
      elCount[SUITS[d.card.suit].el]++;
      if(d.card.rank<=10)nums.push(d.card.rank);
    }
  });
  const out=[];
  // 大アルカナ比率
  const mr=majors.length/ds.length;
  let mTxt;
  if(majors.length===0)mTxt="大アルカナは一枚もありません。この問いは運命の大波ではなく、日々の選択と工夫の範囲で十分に動かせるテーマです。手の届くところに舵があります。";
  else if(mr>=0.6)mTxt=`${ds.length}枚中${majors.length}枚が大アルカナという、非常に濃い卓です。この問いは日常の工夫を超えた、人生の章の変わり目に触れています。流れそのものを尊重してください。`;
  else if(mr>=0.34)mTxt=`大アルカナが${majors.length}枚。日常の問題に見えて、その奥に大きなテーマ——${majors.map(d=>MAJOR[d.card.idx].name).join("・")}——が横たわっています。`;
  else mTxt=`大アルカナは${majors.length}枚（${majors.map(d=>MAJOR[d.card.idx].name).join("・")}）。全体としては現実的な調整の話ですが、この一点だけは軽く扱わないでください。`;
  out.push({label:"切り札の枚数",text:mTxt});
  // エレメント
  const minorsN=ds.length-majors.length;
  if(minorsN>=2){
    const sorted=Object.entries(elCount).sort((a,b)=>b[1]-a[1]);
    const top=sorted[0],zero=sorted.filter(e=>e[1]===0).map(e=>e[0]);
    const elName={火:"情熱と行動",水:"感情と関係",風:"思考と言葉",地:"現実と暮らし"};
    let eTxt="";
    if(top[1]>=Math.max(2,Math.ceil(minorsN/2)))
      eTxt=`エレメントは${top[0]}（${elName[top[0]]}）に重心があります。この問いの本丸は、${elName[top[0]]}のあたりにあると見てよいでしょう。`;
    else eTxt="エレメントは大きく偏らず、複数の領域にまたがる問いです。ひとつの原因に絞り込みすぎない方が、実態に合います。";
    if(zero.length&&zero.length<4&&minorsN>=3)
      eTxt+=`一方で${zero.join("・")}のスートが不在です。${zero.map(z=>elName[z]).join("、")}の視点が、いまの見取り図から抜けているのかもしれません。`;
    out.push({label:"エレメントの配分",text:eTxt});
  }
  // 正逆
  let rTxt;
  if(revs.length===0)rTxt="逆位置は一枚もなし。流れはよく通っています。迷いより、進め方の質を磨く段階です。";
  else if(revs.length===ds.length)rTxt="すべて逆位置という、めずらしい卓です。外側の状況より、内側の見方が総点検を求めています。前提そのものを疑ってよいときです。";
  else{
    const labels=revs.map(i=>`「${ds[i].pos.label.split("｜")[0]}」`).join("・");
    rTxt=`${ds.length}枚中${revs.length}枚が逆位置。引っかかりは${labels}に集中しています。全体が滞っているのではなく、この位置のテーマがほどけると、他も連鎖して流れ出します。`;
  }
  out.push({label:"正逆のバランス",text:rTxt});
  // 数の推移
  if(nums.length>=2){
    let nTxt;
    const asc=nums.every((n,i)=>i===0||n>=nums[i-1]);
    const desc=nums.every((n,i)=>i===0||n<=nums[i-1]);
    const seq=nums.join(" → ");
    if(asc&&nums[0]!==nums[nums.length-1])nTxt=`数札は ${seq} と上昇しています。物事が段階を追って積み上がる、成長の流れです。`;
    else if(desc&&nums[0]!==nums[nums.length-1])nTxt=`数札は ${seq} と下降しています。後退ではなく、一度ほどいて土台に戻る流れと読めます。`;
    else nTxt=`数札は ${seq}。一直線ではなく、行きつ戻りつの推移です。焦らず、波として付き合ってください。`;
    out.push({label:"数字の推移",text:nTxt});
  }
  // 物語
  const kws=ds.map(d=>{
    const info=cardInfo(d.card);
    return (d.rev?info.kwR:info.kwU).split("・")[0].trim();
  });
  let story;
  if(ds.length===1)story=`今日の一枚が差し出したのは「${kws[0]}」。この言葉を、今日一日の胸ポケットに入れて過ごしてみてください。`;
  else story=`卓の上のキーワードを並べると——${kws.map(k=>`「${k}」`).join("、")}。${sp.cards}枚がひとつの声で語っているのは、いまが物語の途中だということです。結末は固定されていません。この読みを地図に、次の一歩はあなたが選んでください。`;
  return {items:out,story};
}

  state.drawn.forEach((d,i)=>{
    const r=readingFor(d,i);
    html+=`<div class="reading">
      <p class="r-pos">${i+1}枚目 ・ ${d.pos.label}</p>

      Xでシェア
    </button>
    <button class="btn-share" id="btn-share-line">
      <svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.4c0 4.1-4 7.4-9 7.4-.9 0-1.8-.1-2.6-.3L4.5 21l1.3-3.6C4.1 16 3 13.8 3 11.4 3 7.3 7 4 12 4s9 3.3 9 7.4z"/></svg>
      LINEで送る
    </button>
  </div>
  <div class="p-actions p-actions-sub">
    <button class="btn-ghost" id="btn-again">同じ形でもう一度</button>
    <button class="btn-ghost" id="btn-newspread">スプレッドを変える</button>
  </div>
  <p class="p-close-line">— Yoi no Uranai-dokoro —</p>

    <div class="pf-rule"></div>

  </div>`;
  c.innerHTML=html;
  $("btn-copy").addEventListener("click",copyReading);
  $("btn-share-x").addEventListener("click",shareToX);
  $("btn-share-line").addEventListener("click",shareToLine);
  $("btn-again").addEventListener("click",()=>{closePanel(true);setupTable();});

  const sp=state.spread;
  let t=`【${sp.name} ・ ${sp.cards}枚】\n`;
  if(state.question)t+=`問い：${state.question}\n`;
  t+="\n";
  state.drawn.forEach((d,i)=>{
    const r=readingFor(d,i);
    t+=`◆ ${d.pos.label}\n${r.info.name}（${r.ori}）\nキーワード：${r.kw}\n${r.posLine}${r.body}\n\n`;
  });
  const syn=synthesize();
  t+="◆ 卓の構成から\n";
  syn.items.forEach(it=>{t+=`・${it.label}：${it.text}\n`;});
  t+=`\n${syn.story}\n\n— 宵の占い処 —`;
  const done=()=>{const to=$("toast");to.classList.add("show");setTimeout(()=>to.classList.remove("show"),1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  }else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement("textarea");ta.value=t;
  ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done();}catch(e){}
  document.body.removeChild(ta);
}
/* パネル開閉 */
let panelOpen=false;
function openPanel(){$("panel").classList.add("show");$("panel").setAttribute("aria-hidden","false");panelOpen=true;}
function closePanel(hard){$("panel").classList.remove("show");$("panel").setAttribute("aria-hidden","true");panelOpen=false;if(hard)$("panel-content").innerHTML="";}
$("panel-grip").addEventListener("click",()=>{
  if(panelOpen){closePanel(false);}
  else if($("panel-content").innerHTML){openPanel();}
});
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
