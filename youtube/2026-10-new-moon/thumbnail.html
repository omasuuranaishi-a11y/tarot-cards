<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天秤座新月 サムネイル</title>
<!-- YouTubeサムネイル 1280x720。文言を変えたら同じサイズで書き出し直す -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night-deep:#0b0e1e;
  --night:#131735;
  --gold:#d8b46a;
  --gold-bright:#f0d69a;
  --gold-dim:rgba(216,180,106,.6);
  --ink:#ece6d8;
  --serif-jp:'Noto Serif JP',serif;
  --serif-en:'Cormorant Garamond',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden}
body{
  position:relative;
  background:radial-gradient(ellipse at 72% 38%, #2a2f66 0%, #1a1f48 32%, var(--night) 58%, var(--night-deep) 100%);
  font-family:var(--serif-jp);color:var(--ink);
}
/* 星 */
#stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#fff}

/* 新月：暗い円盤に、細い金の縁だけが光る */
.newmoon{
  position:absolute;left:706px;top:44px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle at 42% 40%, #161a3a 0%, #0c0f24 70%, #080a1a 100%);
  box-shadow:
    0 0 0 1.5px rgba(240,214,154,.55),
    0 0 38px 6px rgba(216,180,106,.28),
    0 0 120px 30px rgba(140,120,220,.22),
    inset 10px -6px 30px rgba(240,214,154,.10);
}
.newmoon::after{ /* 右上にだけ細い光の弧 */
  content:"";position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from 300deg, transparent 0deg, rgba(240,214,154,.95) 40deg, transparent 95deg);
  -webkit-mask:radial-gradient(circle, transparent 69.3%, #000 69.6%);
          mask:radial-gradient(circle, transparent 69.3%, #000 69.6%);
  filter:blur(1.2px);
}

/* カード */
.cards{position:absolute;left:0;top:0;width:1280px;height:720px}
.card{
  position:absolute;width:236px;height:415px;border-radius:12px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 2px rgba(216,180,106,.55);
}
.card img{width:100%;height:100%;display:block}
.card.death{left:762px;top:176px;transform:rotate(-13deg)}
.card.death img{transform:rotate(180deg)} /* 逆位置 */
.card.moon{left:982px;top:176px;transform:rotate(13deg)}
.card.empress{
  left:856px;top:146px;width:268px;height:471px;
  box-shadow:0 22px 50px rgba(0,0,0,.7),0 0 0 2.5px var(--gold-bright),0 0 46px rgba(240,214,154,.45);
}

/* 文字 */
.copy{position:absolute;left:70px;top:0;height:720px;width:640px;display:flex;flex-direction:column;justify-content:center}
.en{font-family:var(--serif-en);font-weight:600;font-size:30px;letter-spacing:.42em;color:var(--gold-dim);margin-bottom:6px}
.date{display:flex;align-items:baseline;gap:18px;margin-bottom:4px}
.date .d{font-family:var(--serif-en);font-weight:600;font-size:112px;line-height:1;color:var(--ink);letter-spacing:.02em;font-variant-numeric:lining-nums;
  text-shadow:0 0 30px rgba(140,120,220,.6),0 4px 14px rgba(0,0,0,.8)}
.date .w{font-size:34px;font-weight:600;color:var(--ink);letter-spacing:.1em}
.title{
  font-size:114px;font-weight:700;line-height:1.08;letter-spacing:.04em;white-space:nowrap;
  background:linear-gradient(180deg,#fff4d6 0%,var(--gold-bright) 40%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(216,180,106,.45)) drop-shadow(0 5px 10px rgba(0,0,0,.85));
}
.rule{width:420px;height:2px;margin:26px 0 22px;background:linear-gradient(90deg,var(--gold),transparent)}
.tag{font-size:56px;font-weight:600;letter-spacing:.12em;color:var(--ink);text-shadow:0 3px 12px rgba(0,0,0,.9)}
.chip{
  margin-top:30px;align-self:flex-start;padding:10px 26px;border-radius:999px;
  border:1.5px solid var(--gold-dim);background:rgba(11,14,30,.72);
  font-size:26px;font-weight:600;letter-spacing:.14em;color:var(--gold-bright);
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="newmoon"></div>

<div class="cards">
  <div class="card death"><img src="../../13-death.png" alt="死神（逆位置）"></div>
  <div class="card moon"><img src="../../18-moon.png" alt="月"></div>
  <div class="card empress"><img src="../../03-empress.png" alt="女帝"></div>
</div>

<div class="copy">
  <p class="en">NEW MOON in LIBRA</p>
  <div class="date"><span class="d">10.11</span><span class="w">（日）</span></div>
  <h1 class="title">天秤座新月</h1>
  <div class="rule"></div>
  <p class="tag">ほどいて、結び直す。</p>
  <p class="chip">金星逆行中の新月 ｜ タロット×星読み</p>
</div>

<script>
/* 星は毎回同じ配置になるよう固定の乱数で置く */
let seed=1011;
const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const sky=document.getElementById('stars');
for(let i=0;i<140;i++){
  const s=document.createElement('div');s.className='star';
  const r=rnd()*1.8+.6;
  s.style.cssText=`left:${rnd()*1280}px;top:${rnd()*720}px;width:${r}px;height:${r}px;opacity:${(rnd()*.55+.15).toFixed(2)}`;
  sky.appendChild(s);
}
</script>
</body>
</html>
