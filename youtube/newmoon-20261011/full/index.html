<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天秤座新月 全編 v1</title>
<!-- 全編の仮編集（無音・仮タイミング）。1920x1080。window.render(t) で1コマを描く。
     ブラウザで開くと再生（?t=秒 で停止表示）。書き出しは tools/render.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/style.css">
<link rel="stylesheet" href="full.css">
</head>
<body>
<div id="stage"></div>
<script src="../lib/chart-data.js"></script>
<script src="../lib/chart.js"></script>
<script src="../lib/engine.js"></script>
<script src="../lib/scenes.js"></script>
<script src="chapters.js"></script>
<script>
E.build(window.CHAPTERS);
window.CHAPTER_TIMES = E.chapters.map(c => ({ no: c.no, title: c.title, start: c.start, end: c.end }));
const q = new URLSearchParams(location.search);
if (!navigator.webdriver) {
  document.fonts.ready.then(() => {
    if (q.has('t')) { window.render(+q.get('t')); return; }
    const t0 = performance.now() - (+(q.get('from') || 0)) * 1000;
    const loop = () => { window.render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
</html>
